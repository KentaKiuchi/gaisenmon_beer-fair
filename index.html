<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凱旋門 | サイコロ・ルーレット</title>
<style>
  :root{
    --charcoal:#241E19;
    --charcoal-2:#332A22;
    --ember:#C1531B;
    --ember-dark:#9C4013;
    --cream:#FBF6EE;
    --gold:#D9A441;
    --green:#4C9A5F;
    --gray-ink:#9C9184;
    --text:#F2E9DC;
    --text-dim:#B7AA96;
    --outline:#6B4226;
    --pip:#4A4038;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 70% 50% at 50% 6%, rgba(255,255,255,0.06), rgba(255,255,255,0) 65%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 26px),
      linear-gradient(160deg, var(--charcoal), var(--charcoal-2));
    color:var(--text);
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
  }

  /* ---------- ヘッダー ---------- */
  header{
    width:100%;
    max-width:480px;
    padding:16px 18px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .logo{
    height:34px;
    width:auto;
    display:block;
    border-radius:4px;
  }
  .mode-switch{
    display:flex;
    gap:4px;
    background:rgba(255,255,255,0.06);
    padding:4px;
    border-radius:999px;
    flex:none;
  }
  .mode-switch button{
    background:transparent;
    border:none;
    color:var(--text-dim);
    font-weight:800;
    font-size:11.5px;
    padding:7px 13px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .mode-switch button.active{ background:var(--ember); color:#fff; }
  .mode-switch button:not(.active):hover{ color:var(--text); }

  /* ---------- フェアバナー(サイコロ時のみ) ---------- */
  .fair-banner{
    width:100%;
    max-width:480px;
    margin:14px 0 0;
    padding:14px 18px;
    background:linear-gradient(135deg, #2E2620, #241E19);
    border-top:2px solid var(--gold);
    border-bottom:2px solid var(--gold);
    box-shadow: 0 10px 26px -12px rgba(217,164,65,0.35);
  }
  .fair-banner[hidden]{ display:none; }
  .fair-banner .kicker{
    font-size:11px;
    font-weight:800;
    letter-spacing:0.14em;
    color:var(--gold);
    text-shadow: 0 0 14px rgba(217,164,65,0.4);
  }
  .fair-banner .headline{
    font-size:19px;
    font-weight:800;
    color:var(--text);
    margin:2px 0 6px;
    letter-spacing:0.01em;
  }
  .fair-banner .period{
    font-size:13.5px;
    font-weight:700;
    color:var(--text);
  }
  .fair-banner .period b{
    color:var(--gold);
    font-size:15px;
  }
  .fair-banner .note{
    font-size:11px;
    color:var(--text-dim);
    margin-top:4px;
  }

  /* ---------- メイン ---------- */
  main{
    flex:1;
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:1.6rem 18px 2.6rem;
  }
  section[hidden]{ display:none !important; }
  #diceView, #rouletteView{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.4rem;
  }

  /* ---------- 結果パネル(共通) ---------- */
  .result-panel{
    width:100%;
    min-height:78px;
    border-radius:16px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:14px 20px;
  }
  .result-panel .placeholder{
    font-size:13.5px;
    color:var(--text-dim);
  }
  .result-panel .win-num{
    font-family:"SF Mono","Menlo",monospace;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:0.08em;
  }
  .result-panel .win-num b{
    color:var(--text);
    font-size:15px;
  }
  .result-panel .coupon{
    font-size:19px;
    font-weight:800;
    margin-top:4px;
  }
  .result-panel .coupon.win{ color:var(--green); text-shadow:0 0 18px rgba(76,154,95,0.28); }
  .result-panel .coupon.lose{ color:var(--gray-ink); }
  .result-panel .label{
    font-family:"SF Mono","Menlo",monospace;
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:0.14em;
  }
  .result-panel .value{
    font-size:22px;
    font-weight:800;
    color:var(--gold);
    margin-top:4px;
    text-shadow:0 0 16px rgba(217,164,65,0.3);
  }

  /* ---------- サイコロ ---------- */
  .stage-wrap{
    position:relative;
    width:200px;
    height:210px;
  }
  .glow{
    position:absolute;
    inset:-30px;
    background: radial-gradient(circle at 50% 42%, rgba(193,83,27,0.32), rgba(193,83,27,0) 62%);
    pointer-events:none;
  }
  .stage{
    position:absolute;
    top:4px;
    left:50%;
    transform: translateX(-50%);
    perspective: 1000px;
    width:150px;
    height:150px;
  }
  .cube{
    width:100%;
    height:100%;
    position:relative;
    transform-style: preserve-3d;
    transform: rotateX(-24deg) rotateY(35deg);
  }
  .dice-shadow{
    position:absolute;
    bottom:16px;
    left:50%;
    transform: translateX(-50%);
    width:98px;
    height:22px;
    border-radius:50%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.55), rgba(0,0,0,0) 72%);
    opacity:0.35;
  }
  .face{
    position:absolute;
    width:150px;
    height:150px;
    background:linear-gradient(155deg, #FFFDF8 0%, var(--cream) 55%, #EFE6D6 100%);
    border-radius:20px;
    border:4px solid var(--outline);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.05), inset 0 0 0 1px rgba(0,0,0,0.04);
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding:22px;
  }
  .pip{
    width:19px;
    height:19px;
    border-radius:50%;
    background:var(--pip);
    align-self:center;
    justify-self:center;
    border:2px solid var(--outline);
  }
  .face.f1 .pip{ background:var(--ember); }

  .f1{ transform: translateZ(75px); }
  .f6{ transform: rotateY(180deg) translateZ(75px); }
  .f3{ transform: rotateY(90deg) translateZ(75px); }
  .f4{ transform: rotateY(-90deg) translateZ(75px); }
  .f2{ transform: rotateX(90deg) translateZ(75px); }
  .f5{ transform: rotateX(-90deg) translateZ(75px); }

  .p-tl{grid-area:1/1;} .p-tr{grid-area:1/3;} .p-ml{grid-area:2/1;}
  .p-mc{grid-area:2/2;} .p-mr{grid-area:2/3;} .p-bl{grid-area:3/1;}
  .p-br{grid-area:3/3;}

  /* ---------- ルーレット ---------- */
  .wheel-wrap{
    position:relative;
    width:280px;
    height:280px;
    margin-top:0.4rem;
  }
  .pointer{
    position:absolute;
    top:-4px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-top:20px solid var(--gold);
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.4));
    z-index:3;
  }
  .wheel-outer{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:6px solid var(--outline);
    box-shadow: 0 14px 30px -10px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(255,255,255,0.06);
    overflow:hidden;
    background:var(--charcoal-2);
  }
  .wheel-face{
    position:absolute;
    inset:0;
    border-radius:50%;
  }
  .wheel-labels{
    position:absolute;
    inset:0;
    border-radius:50%;
  }
  .wheel-labels span{
    position:absolute;
    top:50%;
    left:50%;
    width:74px;
    margin-left:-37px;
    transform-origin:37px 0;
    font-size:13px;
    font-weight:800;
    color:var(--cream);
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .hub{
    position:absolute;
    top:50%; left:50%;
    width:34px; height:34px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:var(--charcoal);
    border:3px solid var(--gold);
    box-shadow:0 2px 8px rgba(0,0,0,0.5);
    z-index:2;
  }

  .settings-toggle{
    background:transparent;
    color:var(--text-dim);
    font-size:12.5px;
    font-weight:700;
    padding:6px 4px;
    text-decoration:underline;
    text-underline-offset:3px;
    border:none;
    cursor:pointer;
    font-family:inherit;
  }
  .settings-toggle:hover{ color:var(--text); }

  .settings-panel{
    width:100%;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .settings-panel[hidden]{ display:none; }

  .field-label{
    font-size:11px;
    font-weight:800;
    letter-spacing:0.08em;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  .item-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
    align-items:center;
  }
  .item-row input[type=text]{
    flex:1;
    background:var(--charcoal);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:8px;
    padding:8px 10px;
    color:var(--text);
    font-size:13.5px;
    font-family:inherit;
  }
  .item-row input[type=text]:focus{
    outline:none;
    border-color:var(--ember);
  }
  .item-row .weight-input{
    width:52px;
    flex:none;
    background:var(--charcoal);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:8px;
    padding:8px 6px;
    color:var(--gold);
    font-size:13px;
    font-weight:800;
    text-align:center;
    font-family:inherit;
  }
  .item-row .weight-input:focus{
    outline:none;
    border-color:var(--ember);
  }
  .item-row .face-num{
    flex:none;
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--charcoal);
    border:1px solid rgba(255,255,255,0.14);
    color:var(--text-dim);
    font-size:12px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .weight-hint{
    font-size:10.5px;
    color:var(--text-dim);
    margin:-2px 0 8px;
  }

  .item-row .remove-btn{
    background:transparent;
    color:var(--text-dim);
    font-size:16px;
    line-height:1;
    padding:6px 9px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    font-family:inherit;
  }
  .item-row .remove-btn:hover{ color:var(--ember); background:rgba(255,255,255,0.06); }
  .item-row .remove-btn:disabled{ opacity:0.3; cursor:default; }

  .add-item-btn{
    background:transparent;
    color:var(--gold);
    font-size:13px;
    font-weight:800;
    padding:8px 4px;
    text-align:left;
    border:none;
    cursor:pointer;
    font-family:inherit;
  }
  .add-item-btn:hover{ color:var(--text); }

  .duration-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .duration-row input[type=range]{
    flex:1;
    accent-color:var(--ember);
  }
  .duration-row .duration-val{
    font-family:"SF Mono","Menlo",monospace;
    font-size:12.5px;
    color:var(--gold);
    min-width:52px;
    text-align:right;
  }

  /* ---------- 操作(共通ボタン) ---------- */
  .action-btn{
    appearance:none;
    border:none;
    background:var(--ember);
    color:#fff;
    font-weight:800;
    font-size:0.95rem;
    letter-spacing:0.02em;
    padding:0.85rem 2.6rem;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    transition: background 0.15s ease, transform 0.08s ease;
  }
  .action-btn:hover{ background:var(--ember-dark); }
  .action-btn:active{ transform: scale(0.96); }
  .action-btn:focus-visible{ outline:2px solid var(--text); outline-offset:3px; }
  .action-btn:disabled{ background:var(--ember-dark); opacity:0.6; cursor:default; }
</style>
</head>

  const rouletteView = document.getElementById('rouletteView');

  function setMode(mode){
    const isDice = mode === 'dice';
    diceView.hidden = !isDice;
    rouletteView.hidden = isDice;
    fairHeadline.textContent = isDice ? 'サイコロを振って商品ゲット!' : 'ルーレットを回して商品ゲット!';
    modeDiceBtn.classList.toggle('active', isDice);
    modeRouletteBtn.classList.toggle('active', !isDice);
  }
  modeDiceBtn.addEventListener('click', () => setMode('dice'));
  modeRouletteBtn.addEventListener('click', () => setMode('roulette'));

  /* ============================== 設定パネルの簡易ロック ============================== */
  // ここのパスワードを好きな値に変更してください
  const SETTINGS_PASSWORD = '0000';

  // クーポン文言などをHTMLに差し込む前に必ず通す(XSS対策)
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[ch]));
  }

  function toggleSettingsPanel(panel, toggleBtn){
    const nowHidden = panel.hasAttribute('hidden');
    if (nowHidden){
      const input = prompt('設定用パスワードを入力してください');
      if (input === null) return;
      if (input !== SETTINGS_PASSWORD){
        alert('パスワードが違います');
        return;
      }
      panel.removeAttribute('hidden');
      toggleBtn.textContent = '設定を閉じる';
    } else {
      panel.setAttribute('hidden', '');
      toggleBtn.textContent = '設定';
    }
  }

  (function(){
    const cube = document.getElementById('cube');

    const diceSettingsToggle = document.getElementById('diceSettingsToggle');
    const diceSettingsPanel = document.getElementById('diceSettingsPanel');
    const diceItemList = document.getElementById('diceItemList');

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const diceRef = db.ref('dice-roulette-config/dice');
    let editingLock = false;

    function defaultDiceItems(){
      return [
        { text: "上塩タン 100円引き", win: true,  weight: 1 },
        { text: "白菜キムチ 100円引き", win: true,  weight: 1 },
        { text: "白センマイ刺し 100円引き", win: true,  weight: 1 },

    function saveDiceItems(){
      diceRef.set(diceItems).catch(() => {});

      renderDiceItemList();

    function weightedIndex(weights){
      const total = weights.reduce((a, b) => a + Math.max(0, b), 0);
      if (total <= 0) return Math.floor(Math.random() * weights.length);
      let r = Math.random() * total;
      for (let i = 0; i < weights.length; i++){
        r -= Math.max(0, weights[i]);
        if (r < 0) return i;
      }
      return weights.length - 1;
    }

    function renderDiceItemList(){
      diceItemList.innerHTML = '';
      diceItems.forEach((item, i) => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <span class="face-num">${i + 1}</span>
          <input type="text" value="${escapeHtml(item.text)}" data-i="${i}">
          <input type="number" class="weight-input" min="0" max="20" value="${escapeHtml(item.weight)}" data-i="${i}" title="出やすさ">
        `;
        diceItemList.appendChild(row);
      });
      diceItemList.querySelectorAll('input[type=text]').forEach(inp => {
        inp.addEventListener('focus', () => { editingLock = true; });
        inp.addEventListener('blur', () => { editingLock = false; });
        inp.addEventListener('input', () => {
          diceItems[Number(inp.dataset.i)].text = inp.value;
          saveDiceItems();
        });
      });
      diceItemList.querySelectorAll('.weight-input').forEach(inp => {
        inp.addEventListener('focus', () => { editingLock = true; });
        inp.addEventListener('blur', () => { editingLock = false; });
        inp.addEventListener('input', () => {
          diceItems[Number(inp.dataset.i)].weight = Number(inp.value) || 0;
          saveDiceItems();
        });
      });
    }

    let audioCtx = null;
    function getAudioCtx(){
      if (!audioCtx){
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    let diceBuffer = null;
    let diceBufferPromise = null;
    function getDiceBuffer(ctx){
      if (diceBuffer) return Promise.resolve(diceBuffer);
      if (!diceBufferPromise){
        const bin = atob(DICE_ROLL_B64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        diceBufferPromise = ctx.decodeAudioData(bytes.buffer).then(buf => { diceBuffer = buf; return buf; });
      }
      return diceBufferPromise;
    }
    function playRollSound(){
      const ctx = getAudioCtx();
      if (!ctx) return;
      getDiceBuffer(ctx).then(buffer => {
        const src = ctx.createBufferSource();
        src.buffer = buffer;
        const gain = ctx.createGain();
        gain.gain.value = 0.9;
        src.connect(gain).connect(ctx.destination);
        src.start();
      }).catch(() => {});
    }

    function roll(){
      if (rolling) return;
      rolling = true;
      btn.disabled = true;
      diceResultPanel.innerHTML = `<div class="placeholder">振っています…</div>`;

      // 見た目のサイコロは6面均等のまま。当選の抽選だけ重みを反映する(見た目からは分からない)
      const weights = diceItems.map(it => it.weight);
      const faceValue = weightedIndex(weights) + 1;
      const target = orientations[faceValue];

      if (reduceMotion){
        spinX = target.x;
        spinY = target.y;
        cube.style.transform = `rotateX(${spinX}deg) rotateY(${spinY}deg)`;
        rolling = false;
        btn.disabled = false;
        showResult(faceValue);
        return;
      }

      const fromX = spinX, fromY = spinY;
      const spins = 2 + Math.floor(Math.random() * 2);
      const toX = fromX + 360 * spins + target.x - (fromX % 360);
      const toY = fromY + 360 * spins + target.y - (fromY % 360);
      spinX = toX; spinY = toY;

      const wobble = 16 * (Math.random() < 0.5 ? 1 : -1);
      const midX = fromX + (toX - fromX) * 0.55;
      const midY = fromY + (toY - fromY) * 0.55;
      const lateX = fromX + (toX - fromX) * 0.84;
      const lateY = fromY + (toY - fromY) * 0.84;

      const duration = 2150; // 音源(dice-roll)の着地音タイミングに合わせた尺
      playRollSound();

      cube.animate([
        { transform:`rotateX(${fromX}deg) rotateY(${fromY}deg) rotateZ(0deg)`, offset:0 },
        { transform:`rotateX(${midX}deg) rotateY(${midY}deg) rotateZ(${wobble}deg)`, offset:0.55, easing:'cubic-bezier(.32,.08,.4,1)' },
        { transform:`rotateX(${lateX}deg) rotateY(${lateY}deg) rotateZ(${-wobble*0.3}deg)`, offset:0.85, easing:'cubic-bezier(.16,1,.3,1)' },
        { transform:`rotateX(${toX}deg) rotateY(${toY}deg) rotateZ(0deg)`, offset:1, easing:'cubic-bezier(.16,1,.3,1)' },
      ], { duration, fill:'forwards' });

      stage.animate([
        { transform:'translate(-50%,0) scale(1)', offset:0 },
        { transform:'translate(-50%,-14px) scale(1.015)', offset:0.18, easing:'ease-out' },
        { transform:'translate(-50%,-22px) scale(0.99)', offset:0.55, easing:'ease-in' },
        { transform:'translate(-50%,5px) scaleY(0.93) scaleX(1.04)', offset:0.85, easing:'cubic-bezier(.16,1,.3,1)' },
        { transform:'translate(-50%,0) scale(1)', offset:1 },
      ], { duration, fill:'forwards' });

      diceShadow.animate([
        { opacity:0.35, transform:'translateX(-50%) scale(1)', offset:0 },
        { opacity:0.16, transform:'translateX(-50%) scale(0.72)', offset:0.18 },
        { opacity:0.12, transform:'translateX(-50%) scale(0.62)', offset:0.55 },
        { opacity:0.5,  transform:'translateX(-50%) scale(1.22)', offset:0.85 },
        { opacity:0.35, transform:'translateX(-50%) scale(1)', offset:1 },
      ], { duration, fill:'forwards' });

      setTimeout(() => {
        rolling = false;
        btn.disabled = false;
        showResult(faceValue);
      }, duration);
    }

    btn.addEventListener('click', roll);
    window.addEventListener('keydown', (e) => {
      if (diceView.hidden) return;
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        roll();
      }
    });
  })();

  (function(){
    const rouletteResultPanel = document.getElementById('rouletteResultPanel');

    const spinBtn = document.getElementById('spinBtn');

    const settingsPanel = document.getElementById('rouletteSettingsPanel');
    const itemList = document.getElementById('itemList');
    const addItemBtn = document.getElementById('addItemBtn');
    const durationRange = document.getElementById('durationRange');
    const durationVal = document.getElementById('durationVal');

    const PALETTE = ['#D9591C', '#E3B23C', '#4FA562', '#3F7FA6', '#B23A2E', '#A9762E'];
    const rouletteRef = db.ref('dice-roulette-config/roulette');
    let editingLock = false;

    function defaultConfig(){
      return {
        items: [
          { label: '項目1', weight: 1 },
          { label: '項目2', weight: 1 },
          { label: '項目3', weight: 1 },
          { label: '項目4', weight: 1 },
        ],
        duration: 4,
      };
    }
    function saveConfig(){
      rouletteRef.set({ items, duration: parseFloat(durationRange.value) }).catch(() => {});
    }

    let items = defaultConfig().items;
    let currentRotation = 0;
    let spinning = false;

    rouletteRef.on('value', snap => {
      if (editingLock || spinning) return;
      const val = snap.val();
      const conf = (val && Array.isArray(val.items) && val.items.length >= 2) ? val : defaultConfig();
      items = conf.items;
      durationRange.value = conf.duration;
      durationVal.textContent = `${parseFloat(conf.duration).toFixed(1)}秒`;
      renderItemList();
      drawWheel();
    });

    function weightedIndex(weights){
      const total = weights.reduce((a, b) => a + Math.max(0, b), 0);
      if (total <= 0) return Math.floor(Math.random() * weights.length);
      let r = Math.random() * total;
      for (let i = 0; i < weights.length; i++){
        r -= Math.max(0, weights[i]);
        if (r < 0) return i;
      }
      return weights.length - 1;
    }

    function drawWheel(){
      const n = items.length;
      const sliceDeg = 360 / n;

      // マスの大きさは常に均等。重みは抽選だけに反映するので見た目からは分からない
      const stops = items.map((_, i) => {
        const color = PALETTE[i % PALETTE.length];
        return `${color} ${i * sliceDeg}deg ${(i + 1) * sliceDeg}deg`;
      }).join(', ');

      wheelFace.style.background = `
        repeating-conic-gradient(rgba(36,30,25,0.55) 0deg 1.1deg, transparent 1.1deg ${sliceDeg}deg),
        conic-gradient(${stops})
      `;

      wheelLabels.innerHTML = '';
      const radius = 96;
      items.forEach((item, i) => {
        const mid = (i + 0.5) * sliceDeg;
        const span = document.createElement('span');
        span.textContent = item.label || `項目${i + 1}`;
        span.style.transform = `rotate(${mid}deg) translateY(-${radius}px)`;
        wheelLabels.appendChild(span);
      });
    }

    function renderItemList(){
      itemList.innerHTML = '';
      items.forEach((item, i) => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <input type="text" value="${escapeHtml(item.label)}" data-i="${i}">
          <input type="number" class="weight-input" min="0" max="20" value="${escapeHtml(item.weight)}" data-i="${i}" title="出やすさ">
          <button class="remove-btn" data-i="${i}" ${items.length <= 2 ? 'disabled' : ''}>×</button>
        `;
        itemList.appendChild(row);
      });

      itemList.querySelectorAll('input[type=text]').forEach(inp => {
        inp.addEventListener('focus', () => { editingLock = true; });
        inp.addEventListener('blur', () => { editingLock = false; });
        inp.addEventListener('input', () => {
          items[Number(inp.dataset.i)].label = inp.value;
          drawWheel();
          saveConfig();
        });
      });
      itemList.querySelectorAll('.weight-input').forEach(inp => {
        inp.addEventListener('focus', () => { editingLock = true; });
        inp.addEventListener('blur', () => { editingLock = false; });
        inp.addEventListener('input', () => {
          items[Number(inp.dataset.i)].weight = Number(inp.value) || 0;
          saveConfig();
        });
      });
      itemList.querySelectorAll('.remove-btn').forEach(b => {
        b.addEventListener('click', () => {
          if (items.length <= 2) return;
          items.splice(Number(b.dataset.i), 1);
          renderItemList();
          drawWheel();
          saveConfig();
        });
      });
    }

    addItemBtn.addEventListener('click', () => {
      items.push({ label: `項目${items.length + 1}`, weight: 1 });
      renderItemList();
      drawWheel();
      saveConfig();
    });

    settingsToggle.addEventListener('click', () => {
      toggleSettingsPanel(settingsPanel, settingsToggle);
    });

    durationRange.addEventListener('focus', () => { editingLock = true; });
    durationRange.addEventListener('blur', () => { editingLock = false; });
    durationRange.addEventListener('input', () => {
      durationVal.textContent = `${parseFloat(durationRange.value).toFixed(1)}秒`;

    });

    function showResult(label){
      rouletteResultPanel.innerHTML = `

VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV";
    const DRUM_CRASH_TIME = 3.0; // 音源内で「ジャン」が鳴る位置(秒)。実測値
    let audioCtx = null;
    function getAudioCtx(){
      if (!audioCtx){
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    let drumBuffer = null;
    let drumBufferPromise = null;
    function getDrumBuffer(ctx){
      if (drumBuffer) return Promise.resolve(drumBuffer);
      if (!drumBufferPromise){
        const bin = atob(DRUM_ROLL_B64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        drumBufferPromise = ctx.decodeAudioData(bytes.buffer).then(buf => { drumBuffer = buf; return buf; });
      }
      return drumBufferPromise;
    }
    function playSpinSound(durationSec){
      const ctx = getAudioCtx();
      if (!ctx) return;
      getDrumBuffer(ctx).then(buffer => {
        const src = ctx.createBufferSource();
        src.buffer = buffer;
        // 回転時間(durationSec)に着地=シンバルのタイミングが合うよう再生速度を調整
        src.playbackRate.value = DRUM_CRASH_TIME / durationSec;
        const gain = ctx.createGain();
        gain.gain.value = 0.9;
        src.connect(gain).connect(ctx.destination);
        src.start();
      }).catch(() => {});
    }

    function spin(){
      if (spinning) return;
      if (items.length < 2) return;

      spinning = true;
      spinBtn.disabled = true;
      rouletteResultPanel.innerHTML = `<div class="placeholder">回転中…</div>`;

      const n = items.length;
      const sliceDeg = 360 / n;
      const weights = items.map(it => it.weight);
      const chosenIndex = weightedIndex(weights);

      const targetMod = (((-(chosenIndex + 0.5) * sliceDeg) % 360) + 360) % 360;
      const currentMod = ((currentRotation % 360) + 360) % 360;
      let delta = targetMod - currentMod;
      if (delta <= 0) delta += 360;

      const extraSpins = 4 + Math.floor(Math.random() * 3);
      const newRotation = currentRotation + extraSpins * 360 + delta;

      const durationSec = parseFloat(durationRange.value);
      playSpinSound(durationSec);

      wheelFace.animate([
        { transform: `rotate(${currentRotation}deg)`, offset: 0 },
        { transform: `rotate(${newRotation}deg)`, offset: 1 },
      ], {
        duration: durationSec * 1000,
        easing: 'cubic-bezier(.12,0,.22,1)',
        fill: 'forwards',
      });

      currentRotation = newRotation;

      setTimeout(() => {
        spinning = false;
        spinBtn.disabled = false;
        showResult(items[chosenIndex].label);
      }, durationSec * 1000);
    }

    spinBtn.addEventListener('click', spin);
  })();
</script>
